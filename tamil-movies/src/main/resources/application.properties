spring.application.name=tamil-movies


server.port=8008

spring.jpa.generate-ddl = true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/CineVerse?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=myuser
spring.datasource.password=mypassword


spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


app.paths.root=[user.home]/Desktop/CineVerse/TAMIL-SERVICE/Cineverse-microservice/tamil-movies/Downloads/tamil-movies

